name: ROS 2 Humble CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install dependencies
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          rosdep update
          rosdep install --from-paths ros2_fundamentals --ignore-src --rosdistro humble -y

      - name: Build packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --base-paths ros2_fundamentals --event-handlers console_direct+

      - name: Run tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --base-paths ros2_fundamentals --event-handlers console_direct+

      - name: Report test results
        if: always()
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon test-result --all --verbose
